name: CI
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: go test -race ./...
      - run: go vet ./...
      - run: test -z "$(gofmt -l cmd internal)"
      - run: bash -n scripts/*.sh
      - run: node --check internal/checker/worker.cjs
      - run: scripts/test-prepare-release.sh
      - run: npm ci --prefix tools --ignore-scripts --no-audit --no-fund
      - name: Test real JS/TS analyzers
        run: scripts/integration.sh
      - name: Verify local Action
        uses: ./
        with:
          directory: testdata/clean
          mode: typed
          badge_label: ts
          include: src
          fail_on: findings
      - name: Verify selected badge label
        run: grep -q '<title>TS Report (Typed):' testdata/clean/.jsreportcard/badge.svg
      - name: Generate README badge
        run: scripts/update-badge-example.sh
      - uses: actions/upload-artifact@v4
        with:
          name: jsreportcard-example
          path: .github/jsreportcard-example/
          include-hidden-files: true
